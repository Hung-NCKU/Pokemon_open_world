<script>
// 不顯示任何畫面、不等待
Game.title = async () => { };
U.sleep = () => Promise.resolve();
UI.say = async () => { };
UI.choose = async () => 0;
UI.list = async () => 0;
Battle.prototype.moveAnim = async () => { };
Battle.prototype.anim = async () => { };

const results = [];
function check(name, cond, detail = '') { results.push({ name, ok: !!cond, detail }); }
function moveId(sd) { return +Object.keys(SHOWDOWN.moves).find(k => SHOWDOWN.moves[k].id === sd); }

// 建立一場 1 對 1 的戰鬥
function setup(meSp, meLv, foeSp, foeLv) {
  G.state = Game.newState('T', 'kanto', 1);
  const me = Mon.create(meSp, meLv), foe = Mon.create(foeSp, foeLv);
  me.moves = []; foe.moves = [];
  G.state.party = [me];
  const b = new Battle({ wild: foe });
  b.setup();
  b.order = ['me', 'foe'];
  b.queued = { me: { type: 'move', idx: 0 }, foe: { idx: 0 } };
  return b;
}
async function use(b, user, sd, slotPP = 10) {
  const id = moveId(sd);
  const slot = { id, pp: slotPP };
  user.moves = [slot];
  b.volOf(user).lockOn = 2; // 必定命中，避免命中率造成測試結果不穩定
  await b.runMove(user, b.otherOf(user), { mv: md(id), slot });
  return slot;
}

async function run() {
  // 1. 近身戰：降低自己的防禦、特防，對手不變
  {
    const b = setup(68, 50, 143, 50);
    await use(b, b.me, 'closecombat');
    check('近身戰降低使用者的防禦與特防', b.vMe.stg.def === -1 && b.vMe.stg.spd === -1, JSON.stringify(b.vMe.stg));
    check('近身戰不影響對手的能力', b.vFoe.stg.def === 0 && b.vFoe.stg.spd === 0, JSON.stringify(b.vFoe.stg));
  }
  // 2. 過熱：使用者特攻 -2
  {
    const b = setup(6, 50, 143, 50);
    await use(b, b.me, 'overheat');
    check('過熱降低使用者特攻 2 級', b.vMe.stg.spa === -2, JSON.stringify(b.vMe.stg));
    check('過熱不影響對手的特攻', b.vFoe.stg.spa === 0);
  }
  // 3. 點到為止：剩 1 HP 的目標不會被打倒
  {
    let ok = true;
    for (let i = 0; i < 20; i++) {
      const b = setup(123, 80, 19, 3);
      b.foe.hp = 1;
      await use(b, b.me, 'falseswipe');
      if (b.foe.hp !== 1) ok = false;
    }
    check('點到為止不會打倒剩 1 HP 的目標', ok);
  }
  // 4. 自爆：使用者倒下
  {
    const b = setup(74, 30, 143, 30);
    await use(b, b.me, 'selfdestruct');
    check('自爆後使用者倒下', b.me.hp === 0, 'hp=' + b.me.hp);
    check('自爆對目標造成傷害', b.foe.hp < Mon.maxHp(b.foe));
  }
  // 5. 雙倍奉還：沒有受到物理攻擊時失敗；受到後回敬 2 倍
  {
    const b = setup(68, 50, 143, 50);
    const before = b.foe.hp;
    await use(b, b.me, 'counter');
    check('雙倍奉還在未受到物理攻擊時失敗', b.foe.hp === before);
    b.vMe.hitBy = [{ by: 'foe', dmg: 30, cat: 'Physical' }];
    await use(b, b.me, 'counter');
    check('雙倍奉還回敬 2 倍物理傷害', before - b.foe.hp === 60, '造成 ' + (before - b.foe.hp));
    const b2 = setup(68, 50, 143, 50);
    b2.vMe.hitBy = [{ by: 'foe', dmg: 30, cat: 'Special' }];
    const h2 = b2.foe.hp;
    await use(b2, b2.me, 'counter');
    check('雙倍奉還不回敬特殊攻擊', b2.foe.hp === h2);
  }
  // 6. 打草結的威力依目標體重（卡比獸 460kg → 120）
  {
    const b = setup(1, 50, 143, 50);
    check('打草結對卡比獸威力 120', b.basePower(b.me, b.foe, md(moveId('grassknot'))) === 120);
    const b2 = setup(1, 50, 10, 50);
    check('打草結對綠毛蟲威力 20', b2.basePower(b2.me, b2.foe, md(moveId('grassknot'))) === 20);
  }
  // 7. 破壞光線：下一回合需要休息
  {
    const b = setup(143, 50, 143, 50);
    await use(b, b.me, 'hyperbeam');
    check('破壞光線命中後需要休息', b.vMe.recharge === true);
  }
  // 8. 日光束：第一回合蓄力不造成傷害，晴天直接發動
  {
    const b = setup(3, 50, 143, 50);
    const hp = b.foe.hp;
    await use(b, b.me, 'solarbeam');
    check('日光束第一回合蓄力', b.vMe.charging && b.foe.hp === hp);
    const b2 = setup(3, 50, 143, 50);
    b2.field.weather = 'sunnyday';
    const hp2 = b2.foe.hp;
    await use(b2, b2.me, 'solarbeam');
    check('晴天時日光束直接發動', b2.foe.hp < hp2);
  }
  // 9. 守住擋下攻擊
  {
    const b = setup(143, 50, 143, 50);
    b.order = ['foe', 'me'];
    await use(b, b.foe, 'protect');
    const hp = b.foe.hp;
    await use(b, b.me, 'tackle');
    check('守住擋下攻擊', b.foe.hp === hp);
  }
  // 10. 屬性免疫：地面招式打不到飛行，變化招式電磁波對地面無效
  {
    const b = setup(50, 50, 16, 50);
    const hp = b.foe.hp;
    await use(b, b.me, 'earthquake');
    check('地震打不到飛行屬性', b.foe.hp === hp);
    const b2 = setup(25, 50, 50, 50);
    await use(b2, b2.me, 'thunderwave');
    check('電磁波對地面屬性無效', !b2.foe.st);
  }
  // 11. 招式支援狀態
  {
    const none = Object.keys(MOVES).filter(id => md(id).support === 'none').map(id => md(id).id);
    const partial = Object.keys(MOVES).filter(id => md(id).support === 'partial').map(id => md(id).id);
    const full = Object.keys(MOVES).length - none.length - partial.length;
    check('招式支援狀態統計', true, `完整 ${full}、部分 ${partial.length}、未支援 ${none.length}\n    未支援：${none.join(', ')}\n    部分：${partial.join(', ')}`);
  }
  // 13. 努力值：依物種實際產出，總和不超過 510
  {
    const m = Mon.create(1, 10);
    m.ev = [252, 252, 5, 0, 0, 0]; // 合計 509
    Mon.gainEV(m, Mon.create(74, 5)); // 小拳石：防禦 +1
    check('努力值依物種產出（小拳石給防禦）', m.ev[2] === 6, JSON.stringify(m.ev));
    const m2 = Mon.create(1, 10);
    m2.ev = [252, 252, 5, 0, 0, 0];
    Mon.gainEV(m2, Mon.create(144, 50)); // 急凍鳥：特防 +3
    const total = m2.ev.reduce((a, b) => a + b, 0);
    check('努力值總和不超過 510', total === 510, `合計 ${total}`);
    const m3 = Mon.create(1, 10);
    m3.ev = [0, 251, 0, 0, 0, 0];
    Mon.gainEV(m3, Mon.create(68, 50)); // 怪力：攻擊 +3
    check('單項努力值不超過 252', m3.ev[1] === 252, JSON.stringify(m3.ev));
  }
  // 14. 進化條件
  {
    G.state = Game.newState('T', 'kanto', 1);
    const fairy = moveId('charm'), tackle = moveId('tackle');
    const RealDate = Date;
    const at = h => { window.Date = class extends RealDate { getHours() { return h; } }; };
    const eevee = Mon.create(133, 30);
    eevee.happy = 200;
    eevee.moves = [{ id: tackle, pp: 35 }];
    at(23);
    check('伊布夜晚親密度高 → 月亮伊布', Mon.pickEvo(eevee, Mon.evoCandidates(eevee)) === 197);
    eevee.moves.push({ id: fairy, pp: 20 });
    check('會妖精招式的伊布 → 仙子伊布（優先於月亮伊布）', Mon.pickEvo(eevee, Mon.evoCandidates(eevee)) === 700);
    at(12);
    eevee.moves = [{ id: tackle, pp: 35 }];
    check('伊布白天親密度高 → 太陽伊布', Mon.pickEvo(eevee, Mon.evoCandidates(eevee)) === 196);
    eevee.happy = 50;
    check('伊布親密度不足時升級不進化', Mon.evoCandidates(eevee).length === 0);
    check('伊布使用葉之石 → 葉伊布', Mon.pickEvo(eevee, Mon.evoCandidates(eevee, 'leaf-stone')) === 470);
    window.Date = RealDate;
    const kirlia = Mon.create(281, 30);
    kirlia.gender = 'F';
    check('雌性奇魯莉安不能用覺醒之石進化', Mon.evoCandidates(kirlia, 'dawn-stone').length === 0);
    kirlia.gender = 'M';
    check('雄性奇魯莉安用覺醒之石 → 艾路雷朵', Mon.pickEvo(kirlia, Mon.evoCandidates(kirlia, 'dawn-stone')) === 475);
    const w = Mon.create(265, 7);
    const a = Mon.pickEvo(w, Mon.evoCandidates(w)), b = Mon.pickEvo(w, Mon.evoCandidates(w));
    check('刺尾蟲的分歧進化對同一個體固定', a === b && (a === 266 || a === 268));
    const onix = Mon.create(95, 30);
    check('大岩蛇使用金屬膜 → 大鋼蛇（改編自通訊交換）', Mon.pickEvo(onix, Mon.evoCandidates(onix, 'metal-coat')) === 208);
    const ty = Mon.create(236, 20);
    const st = Mon.stats(ty);
    const want = st[1] > st[2] ? 106 : st[1] < st[2] ? 107 : 237;
    check('無畏小子依攻擊與防禦的大小進化', Mon.pickEvo(ty, Mon.evoCandidates(ty)) === want);
  }
  // 20. 關都完整體驗：四天王、勁敵、培育、當地任務、後期道館
  {
    G.state = Game.newState('T', 'kanto', 4);
    World.generate(20261010, 'kanto');
    const league = World.towns.find(t => t.region === 'kanto' && t.kind === 'league');
    const e1 = World.eliteParty(league, 0), e4 = World.eliteParty(league, 3);
    const champTop = World.championParty(league).reduce((a, m) => Math.max(a, m.lv), 0);
    check('四天王科拿的王牌是拉普拉斯', e1[e1.length - 1].sp === 131, e1.map(m => POKEDEX[m.sp].n + m.lv).join(' '));
    check('四天王阿渡的王牌是快龍，等級低於冠軍', e4[e4.length - 1].sp === 149 && e4[e4.length - 1].lv < champTop);
    const r1 = RIVAL.team(1, 4, 5), r2 = RIVAL.team(2, 4, 20), r3 = RIVAL.team(3, 4, 50);
    check('選小火龍時勁敵依序使用傑尼龜、卡咪龜、水箭龜', r1[0].sp === 7 && r2[r2.length - 1].sp === 8 && r3[r3.length - 1].sp === 9);
    // 培育道具
    const m = Mon.create(25, 55);
    m.ev = [0, 0, 0, 0, 0, 0];
    await Game.applyItem(m, 'carbos');
    check('速度增強劑讓速度努力值 +10', m.ev[5] === 10);
    const exp0 = m.exp;
    await Game.applyItem(m, 'exp-candy-s');
    check('經驗糖果Ｓ給予 800 經驗值', m.exp === exp0 + 800 || m.lv > 55);
    m.nat = 0; delete m.mint;
    const before = Mon.stats(m);
    await Game.applyItem(m, 'timid-mint');
    const after = Mon.stats(m);
    check('膽小薄荷：速度提高、攻擊降低，原本的性格不變', after[5] > before[5] && after[1] < before[1] && m.nat === 0);
    m.iv = [0, 0, 0, 0, 0, 0];
    await Game.applyItem(m, 'gold-bottle-cap');
    check('金色王冠：所有能力視為個體值 31', Mon.stats(m)[5] > after[5]);
    // 王冠的 HP 補差額：滿血仍是滿血、受傷補上增加量、瀕死不會復活
    for (const [hp0, name] of [['full', '滿血'], [10, '受傷'], [0, '瀕死']]) {
      const t = Mon.create(25, 60); t.iv = [0, 0, 0, 0, 0, 0]; delete t.ivHT;
      const max0 = Mon.maxHp(t);
      t.hp = hp0 === 'full' ? max0 : hp0;
      await Game.applyItem(t, 'gold-bottle-cap');
      const max1 = Mon.maxHp(t), want = hp0 === 'full' ? max1 : hp0 === 0 ? 0 : 10 + max1 - max0;
      check(`王冠特訓後 HP 正確（${name}）`, max1 > max0 && t.hp === want, `${t.hp}/${max1}`);
    }
    const fainted = Mon.create(25, 60); fainted.ev = [0, 0, 0, 0, 0, 0]; fainted.hp = 0;
    await Game.applyItem(fainted, 'hp-up');
    check('瀕死時使用 HP 增強劑不會復活', fainted.hp === 0);
    // 勁敵依序出現：拿到 6 枚徽章才開始任務時，直接進行第三場並略過第二場
    {
      const keep = G.state, realBattle = Game.battle, seen = [];
      Game.battle = async o => { seen.push(o.trainer.party.length); return 'win'; };
      G.state = Game.newState('T', 'kanto', 4);
      G.state.flags.q_start = 1; G.state.flags.rival1 = 1;
      G.state.badges = { kanto: [0, 1, 2, 3, 4, 5] };
      const kt = World.towns.find(t => t.region === 'kanto');
      await Story.onEnterTown(kt); await Story.onEnterTown(kt);
      check('勁敵事件不會倒序（6 枚徽章時只打第三場）', seen.length === 1 && G.state.flags.rival3 === 1 && G.state.flags.rival2 === 'skip', JSON.stringify(G.state.flags));
      Game.battle = realBattle; G.state = keep;
    }
    const forgot = Mon.create(1, 30);
    const lost = forgot.moves[0].id;
    forgot.moves = forgot.moves.slice(1);
    const remind = POKEDEX[1].l.filter(([lv, id]) => lv <= 30 && !forgot.moves.some(x => x.id === id)).map(([, id]) => id);
    check('想起招式列出忘記的招式', remind.includes(lost));
    // 非關都地區的當地任務
    const s = Game.newState('T', 'hoenn', 252);
    check('豐緣開局的任務是找小田卷博士，不是大木博士', Story.questText(s, 'hoenn').includes('小田卷博士') && !Story.questSummary(s).includes('大木'));
    s.flags.q_hoenn = 1;
    for (const id of [252, 255, 258, 261, 263]) s.caught[id] = 1;
    check('捕捉 5 種豐緣寶可夢後當地任務前進', Story.questStage(s, 'hoenn') === 2);
    // 後期道館：攜帶道具、努力值
    G.state = Game.newState('T', 'kanto', 4);
    G.state.badges = { kanto: [0, 1, 2, 3, 4, 5, 6, 7] };
    const lateGym = World.gymParty(World.towns.find(t => t.region === 'johto' && t.gym === 0));
    check('徽章 8 枚以上的道館全隊攜帶道具', lateGym.every(x => x.item), lateGym.map(x => POKEDEX[x.sp].n + ':' + x.item).join(' '));
  }
  // 19. 存檔驗證與備份
  {
    check('讀入 {} 判定為無效存檔', !Game.parseSave('{}').ok);
    check('損毀的 JSON 判定為損毀（不是沒有存檔）', Game.parseSave('{"seed":1,').error === '存檔格式損毀（無法解析）');
    const good = Game.newState('T', 'kanto', 4);
    good.party.push(Mon.create(4, 5));
    check('正常存檔通過驗證', Game.parseSave(JSON.stringify(good)).ok);
    const partial = JSON.parse(JSON.stringify(good));
    delete partial.bag; delete partial.flags;
    const pr = Game.parseSave(JSON.stringify(partial));
    check('缺少選填欄位時自動補上', pr.ok && pr.state.bag && pr.state.flags);
    const badMon = JSON.parse(JSON.stringify(good));
    badMon.party[0].sp = 99999;
    check('寶可夢資料錯誤時判定無效', !Game.parseSave(JSON.stringify(badMon)).ok);
    const mut = f => { const x = JSON.parse(JSON.stringify(good)); f(x); return Game.parseSave(JSON.stringify(x)); };
    check('空的個體值陣列判定無效', !mut(x => { x.party[0].iv = []; }).ok);
    check('不存在的招式判定無效', !mut(x => { x.party[0].moves = [{ id: 999999, pp: 10 }]; }).ok);
    check('座標超出世界判定無效', !mut(x => { x.x = -5; }).ok);
    const fixed = mut(x => { x.party[0].ev = [300, 0, 0, 0, 0, 0]; x.party[0].hp = 99999; x.party[0].moves[0].pp = 999; });
    check('努力值、HP、PP 超出範圍時自動修正', fixed.ok && fixed.state.party[0].ev[0] === 0 && fixed.state.party[0].hp === Mon.maxHp(fixed.state.party[0]) && fixed.state.party[0].moves[0].pp === MOVES[fixed.state.party[0].moves[0].id].pp);
    // 巢狀資料與培育欄位
    const nb = mut(x => { x.badges = { kanto: null, johto: [0, 0, 9, 'x', 3], nowhere: [1] }; x.champs = { kanto: 1, zzz: 1 }; });
    check('徽章資料錯誤時自動修正，計算徽章不會出錯', nb.ok && !('kanto' in nb.state.badges) && nb.state.badges.johto.join() === '0,3' && !nb.state.badges.nowhere && !nb.state.champs.zzz
      && (() => { const k = G.state; G.state = nb.state; try { return Game.badgeCount() === 2; } finally { G.state = k; } })());
    const nm = mut(x => { x.party[0].mint = 'abc'; x.party[0].ivHT = 'yes'; });
    check('不正確的薄荷、極限特訓欄位會被移除，能力值仍是數字', nm.ok && nm.state.party[0].mint === undefined && nm.state.party[0].ivHT === undefined && Mon.stats(nm.state.party[0]).every(Number.isFinite));
    const ok2 = Game.parseSave(JSON.stringify(good));
    check('驗證後的能力值都是數字', ok2.ok && ok2.state.party.every(m => Mon.stats(m).every(Number.isFinite)));
    // 主存檔損毀時改用備份
    const keep = [localStorage.getItem(SAVE_KEY), localStorage.getItem(SAVE_KEY + '_bak')];
    localStorage.setItem(SAVE_KEY + '_bak', JSON.stringify(good));
    localStorage.setItem(SAVE_KEY, '{"broken');
    const ld = Game.loadSave();
    check('主存檔損毀時讀取備份並回報原因', ld && ld.fromBackup && ld.state && ld.error);
    // 存檔時保留上一份有效存檔作為備份
    localStorage.setItem(SAVE_KEY, JSON.stringify(good));
    G.state = JSON.parse(JSON.stringify(good)); G.state.money = 12345;
    Game.save(true);
    check('存檔時把上一份有效存檔留作備份', JSON.parse(localStorage.getItem(SAVE_KEY + '_bak')).money === good.money && JSON.parse(localStorage.getItem(SAVE_KEY)).money === 12345);
    keep[0] === null ? localStorage.removeItem(SAVE_KEY) : localStorage.setItem(SAVE_KEY, keep[0]);
    keep[1] === null ? localStorage.removeItem(SAVE_KEY + '_bak') : localStorage.setItem(SAVE_KEY + '_bak', keep[1]);
  }
  // 18. 雙方最後一隻同時倒下
  {
    const b = setup(74, 30, 10, 3);
    b.foe.hp = 1;
    await use(b, b.me, 'selfdestruct');
    check('我方自爆同時倒下 → 我方落敗', await b.checkFaints() === 'lose');
    const b2 = setup(10, 3, 74, 30);
    b2.me.hp = 1;
    b2.order = ['foe', 'me'];
    await use(b2, b2.foe, 'explosion');
    check('對方大爆炸同時倒下 → 我方獲勝', await b2.checkFaints() === 'win');
    const b3 = setup(1, 20, 1, 20);
    b3.me.hp = 1; b3.foe.hp = 1; b3.me.st = 'psn'; b3.foe.st = 'psn';
    b3.selfKO = null;
    await b3.endOfTurn();
    check('回合末中毒同時倒下 → 視為全滅', b3.me.hp === 0 && b3.foe.hp === 0 && await b3.checkFaints() === 'lose');
    const b4 = setup(143, 60, 10, 3);
    b4.me.hp = 1; b4.foe.hp = 1;
    b4.selfKO = null;
    await use(b4, b4.me, 'doubleedge');
    check('反作用力同時倒下 → 使用者落敗', b4.me.hp === 0 && await b4.checkFaints() === 'lose');
    const b5 = setup(10, 3, 143, 60);
    b5.me.hp = 1; b5.foe.hp = 1; b5.foe.ability = 'guts';
    b5.selfKO = null; b5.order = ['foe', 'me'];
    await use(b5, b5.foe, 'doubleedge');
    check('對方反作用力同時倒下 → 我方獲勝', b5.foe.hp === 0 && await b5.checkFaints() === 'win');
  }
  // 15. 特性
  {
    const b = setup(130, 50, 68, 50);
    b.me.ability = 'intimidate'; b.foe.ability = 'guts';
    await b.abilityStart(b.me);
    check('威嚇降低對手攻擊', b.vFoe.stg.atk === -1);
    const b2 = setup(130, 50, 376, 50);
    b2.me.ability = 'intimidate'; b2.foe.ability = 'clear-body';
    await b2.abilityStart(b2.me);
    check('恆淨之軀擋下威嚇', b2.vFoe.stg.atk === 0);
    const b3 = setup(50, 50, 92, 50);
    b3.foe.ability = 'levitate';
    const hp3 = b3.foe.hp;
    await use(b3, b3.me, 'earthquake');
    check('飄浮讓地面招式無效', b3.foe.hp === hp3);
    const b4 = setup(68, 100, 74, 5);
    b4.foe.ability = 'sturdy';
    await use(b4, b4.me, 'closecombat');
    check('結實在滿 HP 時撐住一擊', b4.foe.hp === 1, 'hp=' + b4.foe.hp);
    const b5 = setup(186, 50, 143, 50);
    b5.me.ability = 'drizzle';
    await b5.abilityStart(b5.me);
    check('降雨登場時下雨', b5.field.weather === 'raindance');
    const b6 = setup(143, 50, 143, 50);
    b6.foe.ability = 'contrary';
    await use(b6, b6.me, 'growl');
    check('唱反調讓能力下降變成提升', b6.vFoe.stg.atk === 1);
    const b7 = setup(35, 50, 143, 50);
    b7.me.ability = 'magic-guard'; b7.me.st = 'psn';
    const hp7 = b7.me.hp;
    await b7.endOfTurn();
    check('魔法防守不受中毒傷害', b7.me.hp === hp7);
    const b8 = setup(25, 50, 143, 50);
    b8.foe.ability = 'volt-absorb';
    b8.foe.hp = 10;
    await use(b8, b8.me, 'thunderbolt');
    check('蓄電吸收電屬性招式並回復', b8.foe.hp > 10);
  }
  // 16. 持有道具
  {
    const b = setup(143, 50, 143, 50);
    b.me.item = 'leftovers'; b.me.hp = 50;
    await b.endOfTurn();
    check('吃剩的東西回復 1/16', b.me.hp === 50 + Math.floor(Mon.maxHp(b.me) / 16));
    const b2 = setup(68, 100, 10, 5);
    b2.foe.item = 'focus-sash';
    await use(b2, b2.me, 'closecombat');
    check('氣勢披帶在滿 HP 時撐住並消耗', b2.foe.hp === 1 && !b2.foe.item);
    const b3 = setup(143, 50, 143, 50);
    b3.me.item = 'life-orb';
    await use(b3, b3.me, 'tackle');
    check('生命寶珠攻擊後扣 1/10 HP', b3.me.hp === Mon.maxHp(b3.me) - Math.floor(Mon.maxHp(b3.me) / 10));
    const b4 = setup(143, 50, 143, 50);
    b4.me.item = 'choice-band';
    b4.me.moves = [{ id: moveId('tackle'), pp: 35 }, { id: moveId('bodyslam'), pp: 15 }];
    b4.vMe.lockOn = 2;
    await b4.runMove(b4.me, b4.foe, { mv: md(b4.me.moves[0].id), slot: b4.me.moves[0] });
    check('講究頭帶鎖定第一個招式', !!b4.moveBlocked(b4.me, b4.vMe, b4.me.moves[1].id) && !b4.moveBlocked(b4.me, b4.vMe, b4.me.moves[0].id));
    const b5 = setup(68, 60, 143, 60);
    b5.foe.item = 'sitrus-berry';
    b5.foe.hp = Math.floor(Mon.maxHp(b5.foe) * .6);
    await use(b5, b5.me, 'tackle');
    const max5 = Mon.maxHp(b5.foe);
    check('文柚果在 HP 低於一半時發動', !b5.foe.item || b5.foe.hp * 2 > max5, `hp=${b5.foe.hp}/${max5} item=${b5.foe.item}`);
    const b6 = setup(25, 50, 143, 50);
    b6.foe.item = 'lum-berry';
    await use(b6, b6.me, 'thunderwave');
    check('木子果治好麻痺', !b6.foe.st && !b6.foe.item);
  }
  // 17. 關都：城鎮名稱、地標、招牌隊伍、任務
  {
    G.state = Game.newState('T', 'kanto', 4);
    World.generate(20261010, 'kanto');
    const kt = World.towns.filter(t => t.region === 'kanto');
    const brockTown = kt.find(t => t.gym === 0);
    check('關都城鎮使用原作名稱', brockTown.name === '深灰市' && kt.find(t => t.kind === 'league').name === '石英高原');
    const lms = [...World.landmarks.values()];
    check('關都 5 個地標都有放置', lms.length === 5, lms.map(l => l.n).join('、'));
    // 從真新鎮出發，地標入口（陸上：入口下方；海上：可衝浪）都要能到達
    const h = World.homeTown, sx = h.x + 1, sy = h.y + 5;
    const seen = new Uint8Array(WW * WH), q = [[sx, sy]];
    seen[sy * WW + sx] = 1;
    while (q.length) {
      const [x, y] = q.pop();
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = x + dx, ny = y + dy;
        if (!World.inside(nx, ny) || seen[ny * WW + nx]) continue;
        const t = World.tile(nx, ny);
        if (BLOCKED.has(t) || t === T.DOOR) continue;
        seen[ny * WW + nx] = 1; q.push([nx, ny]);
      }
    }
    const unreached = lms.filter(l => ![[0, 1], [1, 0], [-1, 0], [0, -1]].some(([dx, dy]) => seen[(l.y + dy) * WW + l.x + dx]));
    check('所有地標都能抵達（可衝浪）', unreached.length === 0, unreached.map(l => l.n).join('、'));
    G.state.badges = {};
    const brock = World.gymParty(brockTown);
    check('小剛的招牌隊伍（0 枚徽章）：小拳石、大岩蛇', brock.map(m => m.sp).join() === '74,95', brock.map(m => POKEDEX[m.sp].n + m.lv).join(' '));
    G.state.badges = { kanto: [0, 1, 2, 3, 4, 5, 6] };
    const giov = World.gymParty(kt.find(t => t.gym === 7));
    check('坂木後期隊伍的王牌是超甲狂犀', giov[giov.length - 1].sp === 464, giov.map(m => POKEDEX[m.sp].n + m.lv).join(' '));
    const blue = World.championParty(kt.find(t => t.kind === 'league'));
    check('選小火龍時青綠的王牌是水箭龜', blue[5].sp === 9, blue.map(m => POKEDEX[m.sp].n + m.lv).join(' '));
    G.state = Game.newState('T', 'kanto', 4);
    check('任務從第 0 階段開始', Story.questStage(G.state) === 0);
    G.state.flags.q_start = 1;
    for (let i = 1; i <= 10; i++) G.state.caught[i] = 1;
    check('捕捉 10 種後任務前進', Story.questStage(G.state) === 2);
    // 傳說與幻之寶可夢：每種只在地圖上固定放一隻，野外遭遇不會出現
    const far = World.towns.find(t => World.regionBand(t.region)[0] >= 35) || World.towns[0];
    const got = new Set();
    for (let i = 0; i < 600; i++) {
      const b = ['tall', 'cave', 'water', 'snow', 'desert'][i % 5];
      got.add(World.rollWild(far.cx + (i % 7), far.cy + (i % 5), b).sp);
    }
    check('野外遭遇不會出現任何傳說／幻之寶可夢', ![...got].some(id => POKEDEX[id].lg), [...got].filter(id => POKEDEX[id].lg).map(id => POKEDEX[id].n).join('、'));
    const want = Object.values(POKEDEX).filter(sp => sp.lg && !(sp.pre && POKEDEX[sp.pre] && POKEDEX[sp.pre].lg)).map(sp => sp.id);
    const placed = [...World.legends.values()];
    const count = {};
    placed.forEach(l => count[l.sp] = (count[l.sp] || 0) + 1);
    check('每種傳說／幻之寶可夢在地圖上剛好一隻', want.every(id => count[id] === 1) && placed.length === want.length,
      `${placed.length}/${want.length}，缺：${want.filter(id => !count[id]).map(id => POKEDEX[id].n).join('、')}`);
    const bad = placed.filter(l => !World.inside(l.x, l.y) || BLOCKED.has(World.tile(l.x, l.y)) || World.doors.has(l.x + ',' + l.y) || World.trainers.has(l.x + ',' + l.y));
    check('傳說站在可以抵達的格子上', !bad.length, bad.map(l => POKEDEX[l.sp].n).join('、'));
    const ev = placed.filter(l => EVENT_LEGENDS.has(l.sp));
    check('事件傳說站在地標入口前', ev.length === EVENT_LEGENDS.size && ev.every(l => l.lm && l.lm.sp === l.sp));
    const mew = placed.find(l => l.sp === 151);
    check('傳說擋住去路（不能走上去）', mew && !Game.walkable(mew.x, mew.y));
    G.state.legendsCaught = { 151: 1 };
    check('捕捉後就從地圖上消失', mew && !World.legendAt(mew.x, mew.y));
    G.state.legendsCaught = {};
    const old = Game.newState('T', 'kanto', 4); old.party.push(Mon.create(4, 5)); delete old.legendsCaught; old.caught[150] = 1;
    Game.validateState(old);
    check('舊存檔：已捕捉的傳說不會再出現', old.legendsCaught[150] === 1 && !old.legendsCaught[4]);
  }
  // 12. 隨機對戰不出錯
  {
    let err = null;
    try {
      for (let i = 0; i < 40; i++) {
        const b = setup(U.ri(1, 1025), U.ri(5, 70), U.ri(1, 1025), U.ri(5, 70));
        b.me.moves = Mon.movesFor(b.me.sp, b.me.lv).map(id => ({ id, pp: MOVES[id].pp }));
        b.foe.moves = Mon.movesFor(b.foe.sp, b.foe.lv).map(id => ({ id, pp: MOVES[id].pp }));
        for (let t = 0; t < 30; t++) {
          const r = await b.doTurn({ type: 'move', idx: U.ri(0, b.me.moves.length - 1) });
          if (r) break;
        }
      }
    } catch (e) { err = e.stack; }
    check('40 場隨機對戰沒有例外', !err, err || '');
  }
  const pass = results.filter(r => r.ok).length;
  document.getElementById('out').innerHTML = results.map(r => `<span class="${r.ok ? 'pass' : 'fail'}">${r.ok ? '✔' : '✘'} ${r.name}</span>${r.detail ? '\n    ' + r.detail.replace(/</g, '&lt;') : ''}`).join('\n')
    + `\n\n${pass}/${results.length} 通過` + (__errs.length ? '\n錯誤：' + __errs.join('\n') : '');
  document.title = pass === results.length ? 'PASS' : 'FAIL';
}
window.addEventListener('load', () => setTimeout(() => run().catch(e => { document.getElementById('out').textContent = 'EXC ' + e.stack; }), 50));
</script>
</body>
</html>
