<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>戰鬥引擎回歸測試</title>
<style>
  body { font-family: monospace; background: #111; color: #ddd; padding: 16px; }
  .pass { color: #6f6; } .fail { color: #f66; } h1 { font-size: 18px; }
  #battle, #dialog, #choices, #choice-info, #banner, #title, canvas { display: none; }
</style>
</head>
<body>
<h1>戰鬥引擎回歸測試</h1>
<pre id="out">執行中……</pre>
<div id="wrap"><div id="game"><canvas id="world"></canvas><div id="battle"></div><div id="title"></div><div id="banner"></div>
  <div id="choices"></div><div id="choice-info"></div><div id="dialog"><div id="dialog-text"></div><div id="dialog-more"></div></div></div></div>
<script>window.__errs = []; window.onerror = (m, s, l) => __errs.push(m + ' @' + l);</script>
<script src="../data/pokedex.js"></script>
<script src="../data/moves.js"></script>
<script src="../data/showdown.js"></script>
<script src="../data/items.js"></script>
<script src="../data/abilities.js"></script>
<script src="../js/util.js"></script>
<script src="../js/data.js"></script>
<script src="../js/abilities.js"></script>
<script src="../js/mon.js"></script>
<script src="../js/gen3.js"></script>
<script src="../js/sprites.js"></script>
<script src="../js/audio.js"></script>
<script src="../js/world.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/battle.js"></script>
<script src="../js/engine.js"></script>
<script src="../js/battle_view.js"></script>
<script src="../js/game.js"></script>
<script>
// 不顯示任何畫面、不等待
Game.title = async () => { };
U.sleep = () => Promise.resolve();
UI.say = async () => { };
UI.choose = async () => 0;
UI.list = async () => 0;
Battle.prototype.moveAnim = async () => { };
Battle.prototype.anim = async () => { };

const results = [];
function check(name, cond, detail = '') { results.push({ name, ok: !!cond, detail }); }
function moveId(sd) { return +Object.keys(SHOWDOWN.moves).find(k => SHOWDOWN.moves[k].id === sd); }

// 建立一場 1 對 1 的戰鬥
function setup(meSp, meLv, foeSp, foeLv) {
  G.state = Game.newState('T', 'kanto', 1);
  const me = Mon.create(meSp, meLv), foe = Mon.create(foeSp, foeLv);
  me.moves = []; foe.moves = [];
  G.state.party = [me];
  const b = new Battle({ wild: foe });
  b.setup();
  b.order = ['me', 'foe'];
  b.queued = { me: { type: 'move', idx: 0 }, foe: { idx: 0 } };
  return b;
}
async function use(b, user, sd, slotPP = 10) {
  const id = moveId(sd);
  const slot = { id, pp: slotPP };
  user.moves = [slot];
  b.volOf(user).lockOn = 2; // 必定命中，避免命中率造成測試結果不穩定
  await b.runMove(user, b.otherOf(user), { mv: md(id), slot });
  return slot;
}

async function run() {
  // 1. 近身戰：降低自己的防禦、特防，對手不變
  {
    const b = setup(68, 50, 143, 50);
    await use(b, b.me, 'closecombat');
    check('近身戰降低使用者的防禦與特防', b.vMe.stg.def === -1 && b.vMe.stg.spd === -1, JSON.stringify(b.vMe.stg));
    check('近身戰不影響對手的能力', b.vFoe.stg.def === 0 && b.vFoe.stg.spd === 0, JSON.stringify(b.vFoe.stg));
  }
  // 2. 過熱：使用者特攻 -2
  {
    const b = setup(6, 50, 143, 50);
    await use(b, b.me, 'overheat');
    check('過熱降低使用者特攻 2 級', b.vMe.stg.spa === -2, JSON.stringify(b.vMe.stg));
    check('過熱不影響對手的特攻', b.vFoe.stg.spa === 0);
  }
  // 3. 點到為止：剩 1 HP 的目標不會被打倒
  {
    let ok = true;
    for (let i = 0; i < 20; i++) {
      const b = setup(123, 80, 19, 3);
      b.foe.hp = 1;
      await use(b, b.me, 'falseswipe');
      if (b.foe.hp !== 1) ok = false;
    }
    check('點到為止不會打倒剩 1 HP 的目標', ok);
  }
  // 4. 自爆：使用者倒下
  {
    const b = setup(74, 30, 143, 30);
    await use(b, b.me, 'selfdestruct');
    check('自爆後使用者倒下', b.me.hp === 0, 'hp=' + b.me.hp);
    check('自爆對目標造成傷害', b.foe.hp < Mon.maxHp(b.foe));
  }
  // 5. 雙倍奉還：沒有受到物理攻擊時失敗；受到後回敬 2 倍
  {
    const b = setup(68, 50, 143, 50);
    const before = b.foe.hp;
    await use(b, b.me, 'counter');
    check('雙倍奉還在未受到物理攻擊時失敗', b.foe.hp === before);
    b.vMe.hitBy = [{ by: 'foe', dmg: 30, cat: 'Physical' }];
    await use(b, b.me, 'counter');
    check('雙倍奉還回敬 2 倍物理傷害', before - b.foe.hp === 60, '造成 ' + (before - b.foe.hp));
    const b2 = setup(68, 50, 143, 50);
    b2.vMe.hitBy = [{ by: 'foe', dmg: 30, cat: 'Special' }];
    const h2 = b2.foe.hp;
    await use(b2, b2.me, 'counter');
    check('雙倍奉還不回敬特殊攻擊', b2.foe.hp === h2);
  }
  // 6. 打草結的威力依目標體重（卡比獸 460kg → 120）
  {
    const b = setup(1, 50, 143, 50);
    check('打草結對卡比獸威力 120', b.basePower(b.me, b.foe, md(moveId('grassknot'))) === 120);
    const b2 = setup(1, 50, 10, 50);
    check('打草結對綠毛蟲威力 20', b2.basePower(b2.me, b2.foe, md(moveId('grassknot'))) === 20);
  }
  // 7. 破壞光線：下一回合需要休息
  {
    const b = setup(143, 50, 143, 50);
    await use(b, b.me, 'hyperbeam');
    check('破壞光線命中後需要休息', b.vMe.recharge === true);
  }
  // 8. 日光束：第一回合蓄力不造成傷害，晴天直接發動
  {
    const b = setup(3, 50, 143, 50);
    const hp = b.foe.hp;
    await use(b, b.me, 'solarbeam');
    check('日光束第一回合蓄力', b.vMe.charging && b.foe.hp === hp);
    const b2 = setup(3, 50, 143, 50);
    b2.field.weather = 'sunnyday';
    const hp2 = b2.foe.hp;
    await use(b2, b2.me, 'solarbeam');
    check('晴天時日光束直接發動', b2.foe.hp < hp2);
  }
  // 9. 守住擋下攻擊
  {
    const b = setup(143, 50, 143, 50);
    b.order = ['foe', 'me'];
    await use(b, b.foe, 'protect');
    const hp = b.foe.hp;
    await use(b, b.me, 'tackle');
    check('守住擋下攻擊', b.foe.hp === hp);
  }
  // 10. 屬性免疫：地面招式打不到飛行，變化招式電磁波對地面無效
  {
    const b = setup(50, 50, 16, 50);
    const hp = b.foe.hp;
    await use(b, b.me, 'earthquake');
    check('地震打不到飛行屬性', b.foe.hp === hp);
    const b2 = setup(25, 50, 50, 50);
    await use(b2, b2.me, 'thunderwave');
    check('電磁波對地面屬性無效', !b2.foe.st);
  }
  // 11. 招式支援狀態
  {
    const none = Object.keys(MOVES).filter(id => md(id).support === 'none').map(id => md(id).id);
    const partial = Object.keys(MOVES).filter(id => md(id).support === 'partial').map(id => md(id).id);
    const full = Object.keys(MOVES).length - none.length - partial.length;
    check('招式支援狀態統計', true, `完整 ${full}、部分 ${partial.length}、未支援 ${none.length}\n    未支援：${none.join(', ')}\n    部分：${partial.join(', ')}`);
  }
  // 13. 努力值：依物種實際產出，總和不超過 510
  {
    const m = Mon.create(1, 10);
    m.ev = [252, 252, 5, 0, 0, 0]; // 合計 509
    Mon.gainEV(m, Mon.create(74, 5)); // 小拳石：防禦 +1
    check('努力值依物種產出（小拳石給防禦）', m.ev[2] === 6, JSON.stringify(m.ev));
    const m2 = Mon.create(1, 10);
    m2.ev = [252, 252, 5, 0, 0, 0];
    Mon.gainEV(m2, Mon.create(144, 50)); // 急凍鳥：特防 +3
    const total = m2.ev.reduce((a, b) => a + b, 0);
    check('努力值總和不超過 510', total === 510, `合計 ${total}`);
    const m3 = Mon.create(1, 10);
    m3.ev = [0, 251, 0, 0, 0, 0];
    Mon.gainEV(m3, Mon.create(68, 50)); // 怪力：攻擊 +3
    check('單項努力值不超過 252', m3.ev[1] === 252, JSON.stringify(m3.ev));
  }
  // 14. 進化條件
  {
    G.state = Game.newState('T', 'kanto', 1);
    const fairy = moveId('charm'), tackle = moveId('tackle');
    const RealDate = Date;
    const at = h => { window.Date = class extends RealDate { getHours() { return h; } }; };
    const eevee = Mon.create(133, 30);
    eevee.happy = 200;
    eevee.moves = [{ id: tackle, pp: 35 }];
    at(23);
    check('伊布夜晚親密度高 → 月亮伊布', Mon.pickEvo(eevee, Mon.evoCandidates(eevee)) === 197);
    eevee.moves.push({ id: fairy, pp: 20 });
    check('會妖精招式的伊布 → 仙子伊布（優先於月亮伊布）', Mon.pickEvo(eevee, Mon.evoCandidates(eevee)) === 700);
    at(12);
    eevee.moves = [{ id: tackle, pp: 35 }];
    check('伊布白天親密度高 → 太陽伊布', Mon.pickEvo(eevee, Mon.evoCandidates(eevee)) === 196);
    eevee.happy = 50;
    check('伊布親密度不足時升級不進化', Mon.evoCandidates(eevee).length === 0);
    check('伊布使用葉之石 → 葉伊布', Mon.pickEvo(eevee, Mon.evoCandidates(eevee, 'leaf-stone')) === 470);
    window.Date = RealDate;
    const kirlia = Mon.create(281, 30);
    kirlia.gender = 'F';
    check('雌性奇魯莉安不能用覺醒之石進化', Mon.evoCandidates(kirlia, 'dawn-stone').length === 0);
    kirlia.gender = 'M';
    check('雄性奇魯莉安用覺醒之石 → 艾路雷朵', Mon.pickEvo(kirlia, Mon.evoCandidates(kirlia, 'dawn-stone')) === 475);
    const w = Mon.create(265, 7);
    const a = Mon.pickEvo(w, Mon.evoCandidates(w)), b = Mon.pickEvo(w, Mon.evoCandidates(w));
    check('刺尾蟲的分歧進化對同一個體固定', a === b && (a === 266 || a === 268));
    const onix = Mon.create(95, 30);
    check('大岩蛇使用金屬膜 → 大鋼蛇（改編自通訊交換）', Mon.pickEvo(onix, Mon.evoCandidates(onix, 'metal-coat')) === 208);
    const ty = Mon.create(236, 20);
    const st = Mon.stats(ty);
    const want = st[1] > st[2] ? 106 : st[1] < st[2] ? 107 : 237;
    check('無畏小子依攻擊與防禦的大小進化', Mon.pickEvo(ty, Mon.evoCandidates(ty)) === want);
  }
  // 15. 特性
  {
    const b = setup(130, 50, 68, 50);
    b.me.ability = 'intimidate'; b.foe.ability = 'guts';
    await b.abilityStart(b.me);
    check('威嚇降低對手攻擊', b.vFoe.stg.atk === -1);
    const b2 = setup(130, 50, 376, 50);
    b2.me.ability = 'intimidate'; b2.foe.ability = 'clear-body';
    await b2.abilityStart(b2.me);
    check('恆淨之軀擋下威嚇', b2.vFoe.stg.atk === 0);
    const b3 = setup(50, 50, 92, 50);
    b3.foe.ability = 'levitate';
    const hp3 = b3.foe.hp;
    await use(b3, b3.me, 'earthquake');
    check('飄浮讓地面招式無效', b3.foe.hp === hp3);
    const b4 = setup(68, 100, 74, 5);
    b4.foe.ability = 'sturdy';
    await use(b4, b4.me, 'closecombat');
    check('結實在滿 HP 時撐住一擊', b4.foe.hp === 1, 'hp=' + b4.foe.hp);
    const b5 = setup(186, 50, 143, 50);
    b5.me.ability = 'drizzle';
    await b5.abilityStart(b5.me);
    check('降雨登場時下雨', b5.field.weather === 'raindance');
    const b6 = setup(143, 50, 143, 50);
    b6.foe.ability = 'contrary';
    await use(b6, b6.me, 'growl');
    check('唱反調讓能力下降變成提升', b6.vFoe.stg.atk === 1);
    const b7 = setup(35, 50, 143, 50);
    b7.me.ability = 'magic-guard'; b7.me.st = 'psn';
    const hp7 = b7.me.hp;
    await b7.endOfTurn();
    check('魔法防守不受中毒傷害', b7.me.hp === hp7);
    const b8 = setup(25, 50, 143, 50);
    b8.foe.ability = 'volt-absorb';
    b8.foe.hp = 10;
    await use(b8, b8.me, 'thunderbolt');
    check('蓄電吸收電屬性招式並回復', b8.foe.hp > 10);
  }
  // 16. 持有道具
  {
    const b = setup(143, 50, 143, 50);
    b.me.item = 'leftovers'; b.me.hp = 50;
    await b.endOfTurn();
    check('吃剩的東西回復 1/16', b.me.hp === 50 + Math.floor(Mon.maxHp(b.me) / 16));
    const b2 = setup(68, 100, 10, 5);
    b2.foe.item = 'focus-sash';
    await use(b2, b2.me, 'closecombat');
    check('氣勢披帶在滿 HP 時撐住並消耗', b2.foe.hp === 1 && !b2.foe.item);
    const b3 = setup(143, 50, 143, 50);
    b3.me.item = 'life-orb';
    await use(b3, b3.me, 'tackle');
    check('生命寶珠攻擊後扣 1/10 HP', b3.me.hp === Mon.maxHp(b3.me) - Math.floor(Mon.maxHp(b3.me) / 10));
    const b4 = setup(143, 50, 143, 50);
    b4.me.item = 'choice-band';
    b4.me.moves = [{ id: moveId('tackle'), pp: 35 }, { id: moveId('bodyslam'), pp: 15 }];
    b4.vMe.lockOn = 2;
    await b4.runMove(b4.me, b4.foe, { mv: md(b4.me.moves[0].id), slot: b4.me.moves[0] });
    check('講究頭帶鎖定第一個招式', !!b4.moveBlocked(b4.me, b4.vMe, b4.me.moves[1].id) && !b4.moveBlocked(b4.me, b4.vMe, b4.me.moves[0].id));
    const b5 = setup(68, 60, 143, 60);
    b5.foe.item = 'sitrus-berry';
    b5.foe.hp = Math.floor(Mon.maxHp(b5.foe) * .6);
    await use(b5, b5.me, 'tackle');
    const max5 = Mon.maxHp(b5.foe);
    check('文柚果在 HP 低於一半時發動', !b5.foe.item || b5.foe.hp * 2 > max5, `hp=${b5.foe.hp}/${max5} item=${b5.foe.item}`);
    const b6 = setup(25, 50, 143, 50);
    b6.foe.item = 'lum-berry';
    await use(b6, b6.me, 'thunderwave');
    check('木子果治好麻痺', !b6.foe.st && !b6.foe.item);
  }
  // 12. 隨機對戰不出錯
  {
    let err = null;
    try {
      for (let i = 0; i < 40; i++) {
        const b = setup(U.ri(1, 1025), U.ri(5, 70), U.ri(1, 1025), U.ri(5, 70));
        b.me.moves = Mon.movesFor(b.me.sp, b.me.lv).map(id => ({ id, pp: MOVES[id].pp }));
        b.foe.moves = Mon.movesFor(b.foe.sp, b.foe.lv).map(id => ({ id, pp: MOVES[id].pp }));
        for (let t = 0; t < 30; t++) {
          const r = await b.doTurn({ type: 'move', idx: U.ri(0, b.me.moves.length - 1) });
          if (r) break;
        }
      }
    } catch (e) { err = e.stack; }
    check('40 場隨機對戰沒有例外', !err, err || '');
  }
  const pass = results.filter(r => r.ok).length;
  document.getElementById('out').innerHTML = results.map(r => `<span class="${r.ok ? 'pass' : 'fail'}">${r.ok ? '✔' : '✘'} ${r.name}</span>${r.detail ? '\n    ' + r.detail.replace(/</g, '&lt;') : ''}`).join('\n')
    + `\n\n${pass}/${results.length} 通過` + (__errs.length ? '\n錯誤：' + __errs.join('\n') : '');
  document.title = pass === results.length ? 'PASS' : 'FAIL';
}
window.addEventListener('load', () => setTimeout(() => run().catch(e => { document.getElementById('out').textContent = 'EXC ' + e.stack; }), 50));
</script>
</body>
</html>
