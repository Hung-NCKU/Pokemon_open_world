# docker compose up web        → 遊戲 http://localhost:8080/
# docker compose run --rm test → 在 Playwright 的映像檔裡執行 npm test（不必在本機安裝 Node 與瀏覽器）
services:
  web:
    build: .
    ports:
      - "8080:80"

  test:
    image: mcr.microsoft.com/playwright:v1.48.2-noble
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      CI: "1"
    command: sh -c "npm ci && npm test"
